name: CI

on:
    pull_request:
        branches: [develop, master]
    push:
        branches: [develop, master]

env:
    CGO_ENABLED: "0"

jobs:
    test:
        name: Verify
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Check formatting
              run: test -z "$(gofmt -l $(git ls-files '*.go'))"

            - name: Vet
              run: go vet ./...

            # go-ethereum is an implementation detail of core/rlp/ only.
            - name: Check go-ethereum import boundary
              run: |
                  offenders="$(grep -rl '"github.com/ethereum/go-ethereum' --include='*.go' . \
                      | grep -vE '^(\./)?core/rlp/' || true)"
                  if [ -n "$offenders" ]; then
                      echo "::error::go-ethereum must only be imported from core/rlp/:"
                      echo "$offenders"
                      exit 1
                  fi

            - name: Build
              run: go build -v ./...

            - name: Test
              run: go test -v -count=1 ./...
