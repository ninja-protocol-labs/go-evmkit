name: CI

on:
    pull_request:
        branches: [develop, master]
    push:
        branches: [develop, master]

env:
    CGO_ENABLED: "0"

jobs:
    test:
        name: Verify
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Check formatting
              run: test -z "$(gofmt -l $(git ls-files '*.go'))"

            - name: Vet
              run: go vet ./...

            # go-ethereum is an implementation detail of rlp/ only.
            - name: Check go-ethereum import boundary
              run: |
                  offenders="$(grep -rl '"github.com/ethereum/go-ethereum' --include='*.go' . \
                      | grep -vE '^(\./)?rlp/' || true)"
                  if [ -n "$offenders" ]; then
                      echo "::error::go-ethereum must only be imported from rlp/:"
                      echo "$offenders"
                      exit 1
                  fi

            - name: Build
              run: go build -v ./...

            - name: Test
              run: go test -v -count=1 ./...

            - name: Fuzz
              run: |
                  set -uo pipefail
                  logdir="$(mktemp -d)"
                  pids=()
                  descs=()

                  while read -r pkg; do
                      names="$(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true)"
                      for name in $names; do
                          log="$logdir/$(echo "${pkg}_${name}" | tr '/' '_').log"
                          go test -run '^$' -fuzz "^${name}\$" -fuzztime=10s -parallel=2 "$pkg" > "$log" 2>&1 &
                          pids+=("$!")
                          descs+=("$pkg $name|$log")
                      done
                  done < <(go list ./...)

                  status=0
                  for i in "${!pids[@]}"; do
                      desc="${descs[$i]}"
                      label="${desc%%|*}"
                      log="${desc##*|}"
                      if wait "${pids[$i]}"; then
                          echo "::group::fuzz $label (ok)"
                      else
                          echo "::group::fuzz $label (FAILED)"
                          status=1
                      fi
                      cat "$log"
                      echo "::endgroup::"
                  done
                  exit "$status"
